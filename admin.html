<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin ✦ AyaYa Store</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site" id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1><span class="grad" data-i18n="adminTitle"></span> 🛠️</h1>
        <p data-i18n="adminSub"></p>
      </div>
    </section>

    <section class="block" style="padding-top:10px">
      <div class="container" id="admin-root"></div>
    </section>
  </main>

  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    let tab = "products";
    let editing = null; // {type:'product'|'post', id or null}

    /* ---------- guards ---------- */
    function renderAdmin() {
      document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
      const root = document.getElementById("admin-root");
      if (!isAdmin()) {
        root.innerHTML = `<div class="form-card" style="max-width:480px;margin-inline:auto;text-align:center">
          <img src="assets/img/oc-grumpy.png" style="width:150px;margin:0 auto 14px" alt="">
          <h2>⛔ ${t("adminOnly")}</h2><br>
          <a class="btn btn-primary" href="account.html">${t("login")}</a>
        </div>`;
        return;
      }
      root.innerHTML = `
        <div class="admin-tabs">
          <button class="pill${tab === "products" ? " active" : ""}" data-tab="products">🛍 ${t("tabProducts")}</button>
          <button class="pill${tab === "posts" ? " active" : ""}" data-tab="posts">✏️ ${t("tabPosts")}</button>
          <button class="pill${tab === "settings" ? " active" : ""}" data-tab="settings">⚙️ ${t("tabSettings")}</button>
          <span style="flex:1"></span>
          <button class="btn btn-gold btn-sm" id="export-btn">${t("exportData")}</button>
        </div>
        <p class="hint" style="color:var(--muted);margin-bottom:20px">💡 ${t("exportHint")}</p>
        <div id="tab-body"></div>`;
      document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; editing = null; renderAdmin(); }));
      document.getElementById("export-btn").addEventListener("click", exportData);
      if (tab === "products") renderProducts();
      else if (tab === "posts") renderPostsTab();
      else renderSettings();
    }

    /* ---------- products ---------- */
    function renderProducts() {
      const body = document.getElementById("tab-body");
      if (editing && editing.type === "product") return renderProductForm(body);
      const products = getProducts();
      body.innerHTML = `
        <div style="margin-bottom:16px"><button class="btn btn-primary btn-sm" id="add-product">${t("addProduct")}</button></div>
        <div class="table-wrap"><table class="admin">
          <tr><th>${t("thPhoto")}</th><th>${t("thName")}</th><th>${t("thPrice")}</th><th>${t("thCat")}</th><th>${t("thStock")}</th><th>${t("thActions")}</th></tr>
          ${products.map(p => `<tr>
            <td><img src="${esc(p.img)}" alt=""></td>
            <td><b>${esc(p.en.name)}</b><br><span style="color:var(--muted)">${esc(p.ar.name)}</span></td>
            <td class="price">$${p.price}</td>
            <td>${t(p.category)}</td>
            <td>${p.inStock ? "✅" : "❌"}</td>
            <td style="white-space:nowrap">
              <button class="btn btn-ghost btn-sm" data-edit="${p.id}">${t("edit")}</button>
              <button class="btn btn-danger btn-sm" data-del="${p.id}">${t("del")}</button>
            </td></tr>`).join("")}
        </table></div>`;
      document.getElementById("add-product").addEventListener("click", () => { editing = { type: "product", id: null }; renderAdmin(); });
      document.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => { editing = { type: "product", id: b.dataset.edit }; renderAdmin(); }));
      document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
        if (!confirm(t("confirmDel"))) return;
        setProducts(getProducts().filter(p => p.id !== b.dataset.del));
        renderAdmin();
      }));
    }

    function imgField(current) {
      return `<div class="field"><label>${t("fImg")} <small>(${t("fImgHint")})</small></label>
        <input id="f-img" type="text" value="${esc(current || "")}" placeholder="assets/img/… or https://…">
        <input id="f-img-file" type="file" accept="image/*" style="margin-top:8px">
        ${current ? `<img src="${esc(current)}" style="width:90px;border-radius:12px;margin-top:8px">` : ""}
      </div>`;
    }

    function readImgFile(cb) {
      const file = document.getElementById("f-img-file").files[0];
      if (!file) return cb(document.getElementById("f-img").value.trim());
      if (file.size > 900 * 1024) { alert("Image too big (max ~900KB) — please resize it first."); return; }
      const r = new FileReader();
      r.onload = () => cb(r.result);
      r.readAsDataURL(file);
    }

    function renderProductForm(body) {
      const p = getProducts().find(x => x.id === editing.id) || { id: "", img: "", price: 10, category: "paintings", featured: false, inStock: true, en: { name: "", desc: "" }, ar: { name: "", desc: "" } };
      body.innerHTML = `<div class="form-card" style="max-width:680px">
        <h2>${editing.id ? t("edit") : t("addProduct")}</h2><br>
        <div class="field"><label>${t("fNameEn")}</label><input id="f-name-en" value="${esc(p.en.name)}"></div>
        <div class="field"><label>${t("fNameAr")}</label><input id="f-name-ar" dir="rtl" value="${esc(p.ar.name)}"></div>
        <div class="field"><label>${t("fDescEn")}</label><textarea id="f-desc-en" rows="3">${esc(p.en.desc)}</textarea></div>
        <div class="field"><label>${t("fDescAr")}</label><textarea id="f-desc-ar" dir="rtl" rows="3">${esc(p.ar.desc)}</textarea></div>
        <div class="field"><label>${t("fPrice")}</label><input id="f-price" type="number" min="0" step="1" value="${p.price}"></div>
        <div class="field"><label>${t("fCat")}</label>
          <select id="f-cat">${["paintings", "crafts", "stickers", "commissions"].map(c => `<option value="${c}"${p.category === c ? " selected" : ""}>${t(c)}</option>`).join("")}</select></div>
        ${imgField(p.img)}
        <div class="field"><label><input type="checkbox" id="f-featured"${p.featured ? " checked" : ""}> ${t("fFeatured")}</label></div>
        <div class="field"><label><input type="checkbox" id="f-stock"${p.inStock ? " checked" : ""}> ${t("fStock")}</label></div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-primary" id="save-product">${t("save")}</button>
          <button class="btn btn-ghost" id="cancel-edit">${t("cancel")}</button>
        </div></div>`;
      document.getElementById("cancel-edit").addEventListener("click", () => { editing = null; renderAdmin(); });
      document.getElementById("save-product").addEventListener("click", () => {
        readImgFile(img => {
          const nameEn = document.getElementById("f-name-en").value.trim();
          if (!nameEn) return alert(t("errFill"));
          const products = getProducts();
          const item = {
            id: editing.id || nameEn.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + Date.now().toString(36),
            img: img || "assets/img/logo.png",
            price: Number(document.getElementById("f-price").value) || 0,
            category: document.getElementById("f-cat").value,
            featured: document.getElementById("f-featured").checked,
            inStock: document.getElementById("f-stock").checked,
            en: { name: nameEn, desc: document.getElementById("f-desc-en").value.trim() },
            ar: { name: document.getElementById("f-name-ar").value.trim() || nameEn, desc: document.getElementById("f-desc-ar").value.trim() }
          };
          const i = products.findIndex(x => x.id === editing.id);
          if (i >= 0) products[i] = item; else products.push(item);
          setProducts(products);
          editing = null;
          toast("✓ " + t("save"));
          renderAdmin();
        });
      });
    }

    /* ---------- posts ---------- */
    function renderPostsTab() {
      const body = document.getElementById("tab-body");
      if (editing && editing.type === "post") return renderPostForm(body);
      const posts = [...getPosts()].sort((a, b) => b.date.localeCompare(a.date));
      body.innerHTML = `
        <div style="margin-bottom:16px"><button class="btn btn-primary btn-sm" id="add-post">${t("addPost")}</button></div>
        <div class="table-wrap"><table class="admin">
          <tr><th>${t("thPhoto")}</th><th>${t("thTitle")}</th><th>${t("thDate")}</th><th>${t("fTag")}</th><th>${t("thActions")}</th></tr>
          ${posts.map(p => `<tr>
            <td>${p.img ? `<img src="${esc(p.img)}" alt="">` : "📝"}</td>
            <td><b>${esc(p.en.title)}</b><br><span style="color:var(--muted)">${esc(p.ar.title)}</span></td>
            <td>${p.date}</td><td>#${esc(p.tag)}</td>
            <td style="white-space:nowrap">
              <button class="btn btn-ghost btn-sm" data-edit="${p.id}">${t("edit")}</button>
              <button class="btn btn-danger btn-sm" data-del="${p.id}">${t("del")}</button>
            </td></tr>`).join("")}
        </table></div>`;
      document.getElementById("add-post").addEventListener("click", () => { editing = { type: "post", id: null }; renderAdmin(); });
      document.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => { editing = { type: "post", id: b.dataset.edit }; renderAdmin(); }));
      document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
        if (!confirm(t("confirmDel"))) return;
        setPosts(getPosts().filter(p => p.id !== b.dataset.del));
        renderAdmin();
      }));
    }

    function renderPostForm(body) {
      const p = getPosts().find(x => x.id === editing.id) || { id: "", date: new Date().toISOString().slice(0, 10), img: "", tag: "drawings", youtube: "", link: "", en: { title: "", body: "" }, ar: { title: "", body: "" } };
      body.innerHTML = `<div class="form-card" style="max-width:680px">
        <h2>${editing.id ? t("edit") : t("addPost")}</h2><br>
        <div class="field"><label>${t("fTitleEn")}</label><input id="f-title-en" value="${esc(p.en.title)}"></div>
        <div class="field"><label>${t("fTitleAr")}</label><input id="f-title-ar" dir="rtl" value="${esc(p.ar.title)}"></div>
        <div class="field"><label>${t("fBodyEn")}</label><textarea id="f-body-en" rows="5">${esc(p.en.body)}</textarea></div>
        <div class="field"><label>${t("fBodyAr")}</label><textarea id="f-body-ar" dir="rtl" rows="5">${esc(p.ar.body)}</textarea></div>
        <div class="field"><label>${t("fDate")}</label><input id="f-date" type="date" value="${p.date}"></div>
        <div class="field"><label>${t("fTag")}</label><input id="f-tag" value="${esc(p.tag)}" placeholder="drawings / paintings / gaming…"></div>
        <div class="field"><label>${t("fYoutube")}</label><input id="f-youtube" value="${esc(p.youtube)}" placeholder="https://youtube.com/watch?v=…"></div>
        <div class="field"><label>${t("fLink")}</label><input id="f-link" value="${esc(p.link)}" placeholder="https://…"></div>
        ${imgField(p.img)}
        <div style="display:flex;gap:10px">
          <button class="btn btn-primary" id="save-post">${t("save")}</button>
          <button class="btn btn-ghost" id="cancel-edit">${t("cancel")}</button>
        </div></div>`;
      document.getElementById("cancel-edit").addEventListener("click", () => { editing = null; renderAdmin(); });
      document.getElementById("save-post").addEventListener("click", () => {
        readImgFile(img => {
          const titleEn = document.getElementById("f-title-en").value.trim();
          if (!titleEn) return alert(t("errFill"));
          const posts = getPosts();
          const item = {
            id: editing.id || titleEn.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + Date.now().toString(36),
            date: document.getElementById("f-date").value || new Date().toISOString().slice(0, 10),
            img,
            tag: document.getElementById("f-tag").value.trim() || "blog",
            youtube: document.getElementById("f-youtube").value.trim(),
            link: document.getElementById("f-link").value.trim(),
            en: { title: titleEn, body: document.getElementById("f-body-en").value.trim() },
            ar: { title: document.getElementById("f-title-ar").value.trim() || titleEn, body: document.getElementById("f-body-ar").value.trim() }
          };
          const i = posts.findIndex(x => x.id === editing.id);
          if (i >= 0) posts[i] = item; else posts.push(item);
          setPosts(posts);
          editing = null;
          toast("✓ " + t("save"));
          renderAdmin();
        });
      });
    }

    /* ---------- settings ---------- */
    function renderSettings() {
      const s = getSettings();
      document.getElementById("tab-body").innerHTML = `<div class="form-card" style="max-width:560px">
        <div class="field"><label>${t("sYoutube")}</label><input id="s-youtube" value="${esc(s.youtube)}"></div>
        <div class="field"><label>${t("sInstagram")}</label><input id="s-instagram" value="${esc(s.instagram)}"></div>
        <div class="field"><label>${t("sTiktok")}</label><input id="s-tiktok" value="${esc(s.tiktok)}"></div>
        <div class="field"><label>${t("sDiscord")}</label><input id="s-discord" value="${esc(s.discord)}"></div>
        <hr style="border-color:var(--line);margin:20px 0">
        <div class="field"><label>🔑 ${t("password")} (admin)</label><input id="s-pass" type="password" placeholder="••••••"></div>
        <button class="btn btn-primary" id="save-settings">${t("save")}</button>
      </div>`;
      document.getElementById("save-settings").addEventListener("click", async () => {
        setSettings({
          youtube: document.getElementById("s-youtube").value.trim(),
          instagram: document.getElementById("s-instagram").value.trim(),
          tiktok: document.getElementById("s-tiktok").value.trim(),
          discord: document.getElementById("s-discord").value.trim()
        });
        const newPass = document.getElementById("s-pass").value;
        if (newPass) {
          if (newPass.length < 6) return alert(t("errPassLen"));
          const users = getUsers();
          const admin = users.find(u => u.isAdmin);
          if (admin) { admin.pass = await hashPass(newPass); setUsers(users); }
        }
        toast(t("settingsSaved"));
        renderChrome();
      });
    }

    /* ---------- export data.js ---------- */
    function exportData() {
      const content =
        "/* AyaYa Store content — exported from the admin panel */\n\n" +
        "const DEFAULT_PRODUCTS = " + JSON.stringify(getProducts(), null, 2) + ";\n\n" +
        "const DEFAULT_POSTS = " + JSON.stringify(getPosts(), null, 2) + ";\n\n" +
        "const DEFAULT_SETTINGS = " + JSON.stringify(getSettings(), null, 2) + ";\n";
      const blob = new Blob([content], { type: "text/javascript" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "data.js";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    window.onLangChange = renderAdmin;
    document.addEventListener("DOMContentLoaded", renderAdmin);
  </script>
</body>
</html>
