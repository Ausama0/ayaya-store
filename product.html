<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product ✦ AyaYa Store</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site" id="site-header"></header>

  <main>
    <div class="container" id="product-root"></div>

    <section class="block" id="related-block" style="display:none">
      <div class="container">
        <div class="section-head">
          <h2><span class="emoji">✨</span> <span id="related-title"></span></h2>
        </div>
        <div class="grid" id="related-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site" id="site-footer"></footer>
  <div class="lightbox" id="lightbox"><img id="lightbox-img" src="" alt=""></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const productId = params.get("id");
    let qty = 1;
    let mainIdx = 0;

    function ytId(url) {
      const m = String(url || "").match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
      return m ? m[1] : null;
    }

    const cover = p => (p.images && p.images.length ? p.images[0] : p.img);
    const gallery = p => (p.images && p.images.length ? p.images : [p.img]);

    function renderProduct() {
      const root = document.getElementById("product-root");
      const p = getProducts().find(x => x.id === productId);
      document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });

      if (!p) {
        root.innerHTML = `<div class="empty-note" style="padding:80px 0">
          <img src="${esc(img("cartEmpty"))}" style="width:160px" alt="">
          <h2>${t("productNotFound")}</h2><br>
          <a class="btn btn-primary" href="store.html">${t("backToStore")}</a></div>`;
        document.getElementById("related-block").style.display = "none";
        return;
      }

      document.title = loc(p, "name") + " ✦ AyaYa Store";
      const imgs = gallery(p);
      if (mainIdx >= imgs.length) mainIdx = 0;
      const vid = ytId(p.youtube);

      root.innerHTML = `
        <p style="padding-top:26px"><a href="store.html" style="font-weight:800">${t("backToStore")}</a></p>
        <div class="product-wrap">
          <div>
            <div class="gallery-main" id="gallery-main"><img src="${esc(imgs[mainIdx])}" alt="${esc(loc(p, "name"))}"></div>
            ${imgs.length > 1 ? `<div class="gallery-thumbs">${imgs.map((src, i) =>
              `<img src="${esc(src)}" data-idx="${i}" class="${i === mainIdx ? "active" : ""}" alt="">`).join("")}</div>` : ""}
          </div>
          <div class="product-info">
            <div class="product-meta">
              <span class="tag">#${t(p.category)}</span>
              ${p.featured ? `<span class="tag" style="color:var(--gold)">${t("featBadge")}</span>` : ""}
              ${!p.inStock ? `<span class="tag" style="color:var(--magenta)">${t("soldOut")}</span>` : ""}
            </div>
            <h1>${esc(loc(p, "name"))}</h1>
            <span class="price">${money(p.price)}</span>
            <p class="desc">${esc(loc(p, "desc"))}</p>
            ${p.inStock ? `
              <div class="product-meta" style="align-items:center">
                <div class="qty-picker">
                  <button id="qty-dec">−</button><b id="qty-val">${qty}</b><button id="qty-inc">+</button>
                </div>
                <button class="btn btn-primary" id="add-btn" style="font-size:1.1rem;padding:14px 30px">🛒 ${t("buyNow")}</button>
              </div>` : `<button class="btn btn-danger" disabled>${t("soldOut")}</button>`}
            ${vid ? `<div class="yt-embed" style="margin-top:26px"><iframe src="https://www.youtube-nocookie.com/embed/${vid}" title="YouTube video" allowfullscreen loading="lazy"></iframe></div>` : ""}
          </div>
        </div>`;

      // gallery interactions
      document.querySelectorAll(".gallery-thumbs img").forEach(th => th.addEventListener("click", () => {
        mainIdx = Number(th.dataset.idx);
        renderProduct();
      }));
      document.getElementById("gallery-main").addEventListener("click", () => {
        document.getElementById("lightbox-img").src = imgs[mainIdx];
        document.getElementById("lightbox").classList.add("open");
      });
      if (p.inStock) {
        document.getElementById("qty-inc").addEventListener("click", () => { qty++; document.getElementById("qty-val").textContent = qty; });
        document.getElementById("qty-dec").addEventListener("click", () => { if (qty > 1) qty--; document.getElementById("qty-val").textContent = qty; });
        document.getElementById("add-btn").addEventListener("click", () => {
          for (let i = 0; i < qty; i++) addToCart(p.id);
        });
      }

      // related items (same category first, then others)
      const rel = getProducts().filter(x => x.id !== p.id)
        .sort((a, b) => (b.category === p.category) - (a.category === p.category)).slice(0, 3);
      document.getElementById("related-title").textContent = t("relatedTitle");
      document.getElementById("related-block").style.display = rel.length ? "" : "none";
      document.getElementById("related-grid").innerHTML = rel.map(r => `
        <article class="card reveal shown">
          <a class="thumb" href="product.html?id=${encodeURIComponent(r.id)}" style="display:block">
            <img src="${esc(cover(r))}" alt="${esc(loc(r, "name"))}" loading="lazy">
          </a>
          <div class="card-body">
            <h3><a href="product.html?id=${encodeURIComponent(r.id)}" style="color:inherit">${esc(loc(r, "name"))}</a></h3>
            <div class="card-foot">
              <span class="price">${money(r.price)}</span>
              ${r.inStock ? `<button class="btn btn-primary btn-sm" onclick="addToCart('${r.id}')">${t("addToCart")}</button>` : ""}
            </div>
          </div>
        </article>`).join("");
    }

    document.getElementById("lightbox").addEventListener("click", () => document.getElementById("lightbox").classList.remove("open"));
    window.onLangChange = renderProduct;
    document.addEventListener("DOMContentLoaded", renderProduct);
  </script>
</body>
</html>
