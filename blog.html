<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog ✦ AyaYa Store</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site" id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container" style="position:relative">
        <h1><span class="grad" data-i18n="blogTitle"></span> ✏️</h1>
        <p data-i18n="blogSub"></p>
        <img class="corner-oc" src="assets/img/oc-gaming.png" alt="">
      </div>
    </section>

    <section class="block" style="padding-top:10px">
      <div class="container">
        <div class="pills" id="tag-pills"></div>
        <div class="post-grid" id="post-grid" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))"></div>
      </div>
    </section>
  </main>

  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    let activeTag = "all";

    function ytId(url) {
      const m = String(url || "").match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
      return m ? m[1] : null;
    }

    function postCard(p) {
      const vid = ytId(p.youtube);
      return `<article class="post reveal shown" id="${esc(p.id)}">
        ${p.img ? `<div class="thumb"><img src="${esc(p.img)}" alt="" loading="lazy"></div>` : ""}
        <div class="post-body">
          <time>📅 ${p.date} · ${t("by")}</time>
          <h3>${esc(loc(p, "title"))}</h3>
          <p style="white-space:pre-line">${esc(loc(p, "body"))}</p>
          ${vid ? `<div class="yt-embed"><iframe src="https://www.youtube-nocookie.com/embed/${vid}" title="YouTube video" allowfullscreen loading="lazy"></iframe></div>`
                : (p.youtube ? `<a class="btn btn-gold btn-sm" href="${esc(p.youtube)}" target="_blank" rel="noopener">${t("watchVideo")}</a>` : "")}
          ${p.link ? `<a class="btn btn-ghost btn-sm" href="${esc(p.link)}" target="_blank" rel="noopener">${t("openLink")}</a>` : ""}
          <span class="tag" style="align-self:flex-start">#${t(p.tag) !== p.tag ? t(p.tag) : esc(p.tag)}</span>
        </div>
      </article>`;
    }

    function renderBlog() {
      document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });

      const posts = [...getPosts()].sort((a, b) => b.date.localeCompare(a.date));
      const tags = ["all", ...new Set(posts.map(p => p.tag).filter(Boolean))];
      document.getElementById("tag-pills").innerHTML = tags.map(tag =>
        `<button class="pill${tag === activeTag ? " active" : ""}" data-tag="${esc(tag)}">${tag === "all" ? t("allCat") : "#" + (t(tag) !== tag ? t(tag) : tag)}</button>`
      ).join("");
      document.querySelectorAll("[data-tag]").forEach(b => b.addEventListener("click", () => {
        activeTag = b.dataset.tag; renderBlog();
      }));

      const shown = posts.filter(p => activeTag === "all" || p.tag === activeTag);
      document.getElementById("post-grid").innerHTML = shown.map(postCard).join("");

      // deep-link scroll
      if (location.hash) {
        const target = document.getElementById(location.hash.slice(1));
        if (target) setTimeout(() => target.scrollIntoView({ behavior: "smooth", block: "center" }), 150);
      }
    }

    window.onLangChange = renderBlog;
    document.addEventListener("DOMContentLoaded", renderBlog);
  </script>
</body>
</html>
