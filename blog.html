<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — AyaYa Store</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Baloo+Bhaijaan+2:wght@500;700;800&family=Marhey:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site" id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container" style="position:relative">
        <h1><span class="grad" data-i18n="blogTitle"></span> ✏️</h1>
        <p data-i18n="blogSub"></p>
        <img class="corner-oc" data-img="blogCorner" src="assets/img/oc-gaming.png" alt="">
      </div>
    </section>

    <section class="block" style="padding-top:10px">
      <div class="container">
        <div class="pills" id="tag-pills"></div>

        <!-- YouTube corner (retro game zone) -->
        <div class="zone" id="yt-zone-wrap">
          <div class="yt-zone">
            <div class="zone-head">
              <span class="pixel-tag pixel-font">▶ PLAY</span>
              <h2>🎮 <span id="yt-zone-title"></span></h2>
              <p id="yt-zone-sub"></p>
            </div>
            <div id="yt-latest"></div>
            <div class="post-grid" id="yt-grid" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))"></div>
          </div>
        </div>

        <!-- Instagram zone -->
        <div class="zone" id="ig-zone-wrap">
          <div class="zone-head">
            <h2>📸 <span id="ig-zone-title"></span></h2>
            <p id="ig-zone-sub"></p>
          </div>
          <div class="post-grid" id="ig-grid" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))"></div>
        </div>

        <!-- Plain posts -->
        <div class="zone" id="txt-zone-wrap">
          <div class="zone-head">
            <h2>✏️ <span id="txt-zone-title"></span></h2>
          </div>
          <div class="post-grid" id="txt-grid" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    let activeTag = "all";

    function ytId(url) {
      const m = String(url || "").match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
      return m ? m[1] : null;
    }

    function igPath(url) {
      const m = String(url || "").match(/instagram\.com\/(?:[\w.]+\/)?(reel|p|tv)\/([\w-]+)/);
      return m ? `${m[1]}/${m[2]}` : null;
    }

    function postCard(p, opts = {}) {
      const vid = ytId(p.youtube);
      const ig = igPath(p.instagram);
      return `<article class="post reveal shown" id="${esc(p.id)}">
        ${p.img && !opts.noThumb ? `<div class="thumb"><img src="${esc(p.img)}" alt="" loading="lazy"></div>` : ""}
        <div class="post-body">
          <time>📅 ${p.date} · ${t("by")}</time>
          <h3>${esc(loc(p, "title"))}</h3>
          <p style="white-space:pre-line">${esc(loc(p, "body"))}</p>
          ${vid ? `<div class="yt-embed"><iframe src="https://www.youtube-nocookie.com/embed/${vid}" title="YouTube video" allowfullscreen loading="lazy"></iframe></div>`
                : (p.youtube ? `<a class="btn btn-gold btn-sm" href="${esc(p.youtube)}" target="_blank" rel="noopener">${t("watchVideo")}</a>` : "")}
          ${ig ? `<div class="ig-embed"><iframe src="https://www.instagram.com/${ig}/embed/" title="Instagram" loading="lazy" allowfullscreen scrolling="no"></iframe></div>
                 <a class="btn btn-ghost btn-sm" href="${esc(p.instagram)}" target="_blank" rel="noopener" style="align-self:center">${t("watchOnIg")}</a>` : ""}
          ${p.link ? `<a class="btn btn-ghost btn-sm" href="${esc(p.link)}" target="_blank" rel="noopener">${t("openLink")}</a>` : ""}
          <span class="tag" style="align-self:flex-start">#${t(p.tag) !== p.tag ? t(p.tag) : esc(p.tag)}</span>
        </div>
      </article>`;
    }

    function latestVideoCard(p) {
      const vid = ytId(p.youtube);
      return `<div class="yt-latest reveal shown" id="${esc(p.id)}">
        <span class="new-badge">★ NEW! ${t("newVideo")}</span>
        <h3>${esc(loc(p, "title"))}</h3>
        <p style="color:var(--muted);white-space:pre-line">${esc(loc(p, "body"))}</p>
        <div class="yt-embed"><iframe src="https://www.youtube-nocookie.com/embed/${vid}" title="YouTube video" allowfullscreen loading="lazy"></iframe></div>
      </div>`;
    }

    function renderBlog() {
      document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.getElementById("yt-zone-title").textContent = t("ytZone");
      document.getElementById("yt-zone-sub").textContent = t("ytZoneSub");
      document.getElementById("ig-zone-title").textContent = t("igZone");
      document.getElementById("ig-zone-sub").textContent = t("igZoneSub");
      document.getElementById("txt-zone-title").textContent = t("txtZone");

      const posts = [...getPosts()].sort((a, b) => b.date.localeCompare(a.date));
      const tags = ["all", ...new Set(posts.map(p => p.tag).filter(Boolean))];
      document.getElementById("tag-pills").innerHTML = tags.map(tag =>
        `<button class="pill${tag === activeTag ? " active" : ""}" data-tag="${esc(tag)}">${tag === "all" ? t("allCat") : "#" + (t(tag) !== tag ? t(tag) : tag)}</button>`
      ).join("");
      document.querySelectorAll("[data-tag]").forEach(b => b.addEventListener("click", () => {
        activeTag = b.dataset.tag; renderBlog();
      }));

      const shown = posts.filter(p => activeTag === "all" || p.tag === activeTag);
      const yt = shown.filter(p => ytId(p.youtube));
      const igOnly = shown.filter(p => igPath(p.instagram) && !ytId(p.youtube));
      const rest = shown.filter(p => !ytId(p.youtube) && !igPath(p.instagram));

      // YouTube corner: newest video gets the big spot + NEW badge
      const [latest, ...olderYt] = yt;
      document.getElementById("yt-latest").innerHTML = latest ? latestVideoCard(latest) : "";
      document.getElementById("yt-grid").innerHTML = olderYt.map(p => postCard(p)).join("");
      document.getElementById("yt-zone-wrap").style.display = yt.length ? "" : "none";

      document.getElementById("ig-grid").innerHTML = igOnly.map(p => postCard(p)).join("");
      document.getElementById("ig-zone-wrap").style.display = igOnly.length ? "" : "none";

      document.getElementById("txt-grid").innerHTML = rest.map(p => postCard(p)).join("");
      document.getElementById("txt-zone-wrap").style.display = rest.length ? "" : "none";

      applyImages();

      // deep-link scroll
      if (location.hash) {
        const target = document.getElementById(location.hash.slice(1));
        if (target) setTimeout(() => target.scrollIntoView({ behavior: "smooth", block: "center" }), 150);
      }
    }

    window.onLangChange = renderBlog;
    document.addEventListener("DOMContentLoaded", renderBlog);
  </script>
</body>
</html>
